<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <meta name="description" content="Code Block – פרויקט תכנות בלוקים">
  <title>Code Block</title>
  <style>
    :root { font-family: system-ui,-apple-system,"Segoe UI",Arial,sans-serif; color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #0b1220; color: #f8fafc; }
    header { max-width: 1100px; margin: auto; padding: 24px 16px 14px; display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap; }
    h1 { margin:0; font-size:clamp(1.5rem,4vw,2rem); }
    p { color: #cbd5e1; line-height:1.6; }
    main { max-width:1100px; margin:auto; padding:0 16px 32px; }
    .actions { display:flex; flex-wrap:wrap; gap:10px; }
    a.button { display:inline-block; padding:10px 16px; border:1px solid #64748b; border-radius:10px; color:white; text-decoration:none; }
    a.button.primary { background:#2563eb; border-color:#2563eb; }
    .frame { width:100%; aspect-ratio: 4 / 3; min-height:400px; border:1px solid #334155; border-radius:14px; overflow:hidden; background:#fff; }
    iframe { width:100%; height:100%; border:0; }
    small { display:block; margin-top:12px; color:#94a3b8; }
    @media(max-width:600px) { .frame { aspect-ratio:auto; height:65vh; min-height:340px; } }
  </style>
</head>
<body>
  <header>
    <h1>Code Block</h1>
    <nav class="actions" aria-label="קישורים">
      <a class="button primary" href="https://scratch.mit.edu/projects/1438951325/editor/" target="_blank" rel="noopener noreferrer">פתיחה בעורך Scratch</a>
      <a class="button" href="https://scratch.mit.edu/projects/1438951325/" target="_blank" rel="noopener noreferrer">צפייה בפרויקט המקורי</a>
    </nav>
  </header>
  <main>
    <p>תצוגת הפרויקט המקורי. להפעלת העורך לחצו על ״פתיחה בעורך Scratch״.</p>
    <div class="frame">
      <iframe title="פרויקט Scratch" src="https://scratch.mit.edu/projects/1438951325/embed" allowfullscreen loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
    </div>
    <small>התצוגה תלויה בזמינות Scratch ובכך שהפרויקט ציבורי. זהו דף מארח, לא עותק עצמאי של עורך Scratch.</small>
  </main>
</body>
</html>
