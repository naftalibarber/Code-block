<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#10172b">
  <meta name="description" content="משחק Code Block מתוך Scratch">
  <title>Code Block</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#10172b;color:#f6f7fb;font-family:Arial,"Segoe UI",sans-serif}
    main{width:min(1100px,96vw);margin:0 auto;padding:24px 0}
    h1{text-align:center;letter-spacing:.02em;margin:12px 0 8px}
    p{text-align:center;color:#cbd5e1}
    .game{position:relative;aspect-ratio:4/3;max-height:80vh;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 16px 50px #0008}
    iframe{width:100%;height:100%;border:0;display:block}
    .links{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:18px}
    a{color:#fff;background:#4c6ef5;border-radius:9px;padding:12px 18px;text-decoration:none}
    a.secondary{background:#273451}
    footer{text-align:center;color:#a7b5ca;margin:24px 0;font-size:.85rem}
  </style>
</head>
<body>
  <main>
    <h1>Code Block</h1>
    <p>פרויקט Scratch — שחקו ישירות באתר</p>
    <div class="game">
      <iframe title="Code Block Scratch Project" src="https://scratch.mit.edu/projects/1438951325/embed" allowfullscreen allow="fullscreen"></iframe>
    </div>
    <nav class="links">
      <a href="https://scratch.mit.edu/projects/1438951325/" target="_blank" rel="noopener noreferrer">פתיחת הפרויקט ב־Scratch</a>
      <a class="secondary" href="https://scratch.mit.edu/projects/1438951325/editor" target="_blank" rel="noopener noreferrer">פתיחה בעורך Scratch</a>
    </nav>
    <footer>המשחק נטען מ־Scratch ודורש גישה לאינטרנט ופרויקט זמין לשיתוף.</footer>
  </main>
</body>
</html>
