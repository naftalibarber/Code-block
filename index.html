<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Code Block — סביבת תכנות בבלוקים</title>
<script src="https://unpkg.com/blockly@11.2.1/blockly.min.js"></script>
<script src="https://unpkg.com/blockly@11.2.1/msg/he.js"></script>
<script src="https://unpkg.com/blockly@11.2.1/javascript_compressed.js"></script>
<style>
:root{color-scheme:dark;--bg:#0b1220;--panel:#161f30;--border:#2e4059;--ink:#e6efff;--muted:#a9b8d0;--accent:#6c8bff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px Arial,"Segoe UI",sans-serif}
header{display:flex;align-items:center;gap:14px;justify-content:space-between;padding:13px 20px;background:var(--panel);border-bottom:1px solid var(--border);flex-wrap:wrap}
h1{font-size:22px;margin:0}small{color:var(--muted)}button,.btn{border:1px solid #516a92;border-radius:9px;background:#273c60;color:#fff;padding:9px 13px;font:inherit;cursor:pointer}
button.primary{background:#4266d9;border-color:#4266d9}button:hover{filter:brightness(1.18)}button:focus-visible{outline:3px solid #a9c5ff}
.toolbar{display:flex;gap:7px;align-items:center;flex-wrap:wrap}main{display:grid;grid-template-columns:minmax(0,2fr) minmax(285px,1fr);height:calc(100vh - 79px);min-height:520px}
#blocklyDiv{height:100%;width:100%;direction:ltr;background:#fff}
aside{border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0;background:#121c2c}
section{padding:14px;border-bottom:1px solid var(--border)}h2{font-size:16px;margin:0 0 9px}
textarea,pre{background:#091321;color:#d9e6ff;border:1px solid #34465d;border-radius:8px;padding:12px;font:13px/1.55 Consolas,monospace;width:100%;direction:ltr;text-align:left;white-space:pre-wrap;overflow:auto}
#code{min-height:170px;resize:vertical}#output{flex:1;min-height:100px;margin:0}p{margin:6px 0;color:var(--muted);font-size:13px}
#status{font-size:12px;color:#b6cfec}input[type=file]{display:none}
@media(max-width:850px){main{grid-template-columns:1fr;grid-template-rows:58vh auto;height:auto}aside{min-height:430px;border-right:0;border-top:1px solid var(--border)}header{padding:12px}h1{font-size:19px}}
</style>
</head>
<body>
<header>
<div><h1>🧩 Code Block</h1><small>סביבת תכנות עצמאית בבלוקים</small></div>
<div class="toolbar">
<button class="primary" id="run">▶ הרץ</button><button id="save">שמור פרויקט</button>
<button id="load">פתח פרויקט</button><button id="clear">נקה</button>
<input id="file" type="file" accept=".json,application/json">
<span id="status" role="status"></span>
</div>
</header>
<main>
<div id="blocklyDiv" aria-label="משטח עבודה בבלוקים"></div>
<aside>
<section><h2>קוד JavaScript שנוצר</h2><textarea id="code" readonly spellcheck="false" aria-label="קוד שנוצר"></textarea></section>
<section style="display:flex;flex:1;flex-direction:column;min-height:0"><h2>פלט התוכנית</h2>
<pre id="output" aria-live="polite">כדי להתחיל, גררו בלוקים לאזור העבודה ולחצו על 'הרץ'.</pre>
<p>הקוד רץ במסגרת מבודדת, ללא גישה לקבצים או לחשבון שלך. ספריית Blockly נטענת מהאינטרנט.</p></section>
</aside>
</main>
<script>
(function(){
'use strict';
const status=document.getElementById('status'), output=document.getElementById('output'), code=document.getElementById('code');
if(!window.Blockly || !Blockly.JavaScript){output.textContent='לא ניתן לטעון את Blockly. בדקו את החיבור לאינטרנט.';return;}
const toolbox={kind:'categoryToolbox',contents:[
{kind:'category',name:'לוגיקה',colour:'#5C81A6',contents:[{kind:'block',type:'controls_if'},{kind:'block',type:'logic_compare'},{kind:'block',type:'logic_operation'},{kind:'block',type:'logic_negate'},{kind:'block',type:'logic_boolean'},{kind:'block',type:'logic_null'}]},
{kind:'category',name:'לולאות',colour:'#5CA65C',contents:[{kind:'block',type:'controls_repeat_ext',inputs:{TIMES:{shadow:{type:'math_number',fields:{NUM:10}}}}},{kind:'block',type:'controls_whileUntil'},{kind:'block',type:'controls_for'},{kind:'block',type:'controls_forEach'},{kind:'block',type:'controls_flow_statements'}]},
{kind:'category',name:'מתמטיקה',colour:'#5C68A6',contents:[{kind:'block',type:'math_number'},{kind:'block',type:'math_arithmetic'},{kind:'block',type:'math_single'},{kind:'block',type:'math_random_int'},{kind:'block',type:'math_round'},{kind:'block',type:'math_modulo'}]},
{kind:'category',name:'טקסט',colour:'#5CA68D',contents:[{kind:'block',type:'text'},{kind:'block',type:'text_join'},{kind:'block',type:'text_length'},{kind:'block',type:'text_print'},{kind:'block',type:'text_isEmpty'}]},
{kind:'category',name:'רשימות',colour:'#745CA6',contents:[{kind:'block',type:'lists_create_with'},{kind:'block',type:'lists_length'},{kind:'block',type:'lists_getIndex'}]},
{kind:'category',name:'משתנים',custom:'VARIABLE',colour:'#A65C81'},
{kind:'category',name:'פונקציות',custom:'PROCEDURE',colour:'#995BA5'}
]};
const workspace=Blockly.inject('blocklyDiv',{toolbox,rtl:true,trashcan:true,scrollbars:true,zoom:{controls:true,wheel:true,startScale:.9,maxScale:2,minScale:.35,scaleSpeed:1.15},grid:{spacing:20,length:3,colour:'#eee',snap:true}});
const generator=Blockly.JavaScript;
generator.addReservedWords('window,document,globalThis,parent,top,self');
function refresh(){try{code.value=generator.workspaceToCode(workspace);status.textContent='מוכן';}catch(e){code.value='';status.textContent='שגיאה בהפקת קוד: '+e.message;}}
workspace.addChangeListener(e=>{if(e.type!==Blockly.Events.UI)refresh();});
function starter(){const xml=Blockly.utils.xml.textToDom('<xml xmlns="https://developers.google.com/blockly/xml"><block type="text_print" x="40" y="40"><value name="TEXT"><shadow type="text"><field name="TEXT">שלום מעולם הבלוקים!</field></shadow></value></block></xml>');Blockly.Xml.domToWorkspace(xml,workspace);}
starter();refresh();setTimeout(()=>Blockly.svgResize(workspace),50);
document.getElementById('clear').onclick=()=>{if(confirm('לנקות את כל הבלוקים?')){workspace.clear();refresh();output.textContent='';}};
document.getElementById('save').onclick=()=>{const data=JSON.stringify({format:'code-block-v1',workspace:Blockly.serialization.workspaces.save(workspace)},null,2);const blob=new Blob([data],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='code-block-project.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);status.textContent='הפרויקט נשמר';};
document.getElementById('load').onclick=()=>document.getElementById('file').click();
document.getElementById('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const data=JSON.parse(await f.text());if(data.format!=='code-block-v1'||!data.workspace)throw Error('קובץ לא מתאים');Blockly.serialization.workspaces.load(data.workspace,workspace);refresh();status.textContent='הפרויקט נטען';}catch(err){alert('שגיאה בפתיחת הקובץ: '+err.message);}e.target.value='';};
let runner=null;
window.addEventListener('message',e=>{if(!runner||e.source!==runner.contentWindow||!e.data||e.data.tag!=='code-block-output')return;output.textContent+=(output.textContent?'\n':'')+String(e.data.value).slice(0,2000);});
document.getElementById('run').onclick=()=>{
if(runner){runner.remove();runner=null;}
output.textContent='';refresh();
const js=code.value, unique='code-block-output';
runner=document.createElement('iframe');
runner.setAttribute('sandbox','allow-scripts');
runner.style.display='none';
const escaped=js.replace(/<[/]script/gi,'<\\\\/script');
runner.srcdoc='<!doctype html><meta charset="utf-8"><script>'+
'const send=v=>parent.postMessage({tag:"'+unique+'",value:String(v)},"*");'+
'console.log=(...a)=>send(a.join(" "));console.error=(...a)=>send("שגיאה: "+a.join(" "));'+
'window.alert=(x)=>send(x);'+
'window.onerror=(m)=>{send("שגיאה: "+m);return true;};'+
'try{'+escaped+'}catch(e){send("שגיאה: "+e.message)}'+
'</scr'+'ipt>';
document.body.appendChild(runner);
status.textContent='התוכנית הופעלה';
};
window.addEventListener('resize',()=>Blockly.svgResize(workspace));
})();
</script>
</body>
</html>
