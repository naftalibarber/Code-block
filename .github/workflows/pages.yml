name: Deploy Code Block to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "scratch-clone/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: scratch-clone/package-lock.json
      - name: Install dependencies
        working-directory: scratch-clone
        run: npm ci --legacy-peer-deps
      - name: Build for Pages
        working-directory: scratch-clone
        run: npm run build:pages
      - name: Disable Jekyll
        run: touch scratch-clone/dist/client/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: scratch-clone/dist/client
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
